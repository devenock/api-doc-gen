name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, test (${{ matrix.os }})
    # GoReleaser ships binaries for Linux, macOS, and Windows, and os.Root
    # (the TOCTOU fix in pkg/analyzer) has documented platform-specific
    # behavior differences - testing only on Linux would mean two of the
    # three platforms we actually publish for are never exercised in CI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # gofmt's output doesn't vary by OS, so this only needs to run once;
      # the [ -n "$unformatted" ] test is bash syntax, which isn't the
      # default shell on windows-latest runners, hence the explicit shell.
      - name: Check formatting (gofmt)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd pkg internal main.go)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -cover

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  security:
    name: gosec, govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gosec via `go install` on the runner's own toolchain, not the
      # securego/gosec Docker action: that image bundles its own fixed Go
      # version and sets GOTOOLCHAIN=local internally, so the moment go.mod's
      # `go` directive passes whatever Go release that image happens to
      # bundle, it silently fails to load every package (0 files, 0 issues,
      # no useful signal) - discovered when bumping to 1.26.8 broke it
      # against gosec's then-current image (bundled 1.26.5). Installing from
      # source with actions/setup-go sidesteps that ceiling entirely, the
      # same way govulncheck-action already does below.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      # Excludes below are project-wide, not per-line #nosec, because each is
      # a structural property of what this tool does, not a one-off:
      #   G304 (file inclusion via variable) - the analyzer's whole job is
      #     reading files discovered by walking the target project directory.
      #     Every such read goes through Analyzer.root (os.Root, Go 1.24+),
      #     which confines it to the project tree and closes the TOCTOU gap
      #     G122 used to flag here (see pkg/analyzer/analyzer.go); this
      #     exclude is about gosec not recognizing that pattern, not an
      #     unaddressed risk.
      #   G204 (subprocess launched with a variable) - opening a browser to
      #     preview generated docs; every call site uses a fixed binary name
      #     (open/xdg-open/cmd) with the variable part only ever in argv,
      #     never the command itself.
      #   G301/G306 (dir/file permissions) - generated docs and the
      #     .apidoc-gen.yaml config file are meant to be shared/committed;
      #     0755/0644 is correct for them. api-doc-gen holds no credentials
      #     of its own (it never talks to any external API), so there's
      #     nothing here that should be narrower.
      - name: Run gosec
        run: gosec -exclude=G204,G301,G304,G306 ./...

      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod
