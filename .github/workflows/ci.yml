name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l cmd pkg internal main.go)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -cover

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  security:
    name: gosec, govulncheck
    runs-on: ubuntu-latest
    steps:
      # Neither tool needs a separate setup-go step here: gosec's action runs
      # in its own Docker image with a bundled toolchain, and govulncheck-
      # action does its own checkout + setup-go internally (go-version-file
      # below points it at this repo's go.mod).
      - uses: actions/checkout@v4

      # Excludes below are project-wide, not per-line #nosec, because each is
      # a structural property of what this tool does, not a one-off:
      #   G304/G703 (file/path from a variable) - the analyzer's whole job is
      #     reading and, for --write-annotations, writing files discovered by
      #     walking the target project directory.
      #   G204 (subprocess launched with a variable) - opening a browser/the
      #     Postman desktop app; every call site uses a fixed binary name
      #     (open/xdg-open/cmd, or one resolved via exec.LookPath) with the
      #     variable part only ever in argv, never the command itself.
      #   G301/G306 (dir/file permissions) - generated docs and the
      #     .apidoc-gen.yaml config file are meant to be shared/committed;
      #     0755/0644 is correct for them. Anything actually secret (the
      #     Postman credentials file) is already 0600/0700 and not flagged.
      #   G122 (TOCTOU on file reads inside filepath.Walk) - a real, known
      #     residual gap (isSymlink already covers the common case: a
      #     pre-existing symlink at walk time) that warrants a proper fix via
      #     Go 1.24's os.Root, tracked as follow-up work rather than done
      #     under this exclude.
      - uses: securego/gosec@v2.29.0
        with:
          args: -exclude=G122,G204,G301,G304,G306,G703 ./...

      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod
